openapi: 3.0.3

info:
  title: Petstore API
  description: pet management API
  version: 1.0.0

servers:
  - url: http://localhost:5000
    description: Local development server

tags:
  - name: Pets
    description: Pet management endpoints

paths:

  /pets:

    get:
      operationId: listPets
      tags:
        - Pets
      summary: List all pets
      description: Get pet list with optional limit and tag filter

      parameters:
        - name: limit
          in: query
          required: false
          description: Pet limit (default is 20, max is 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

        - name: tag
          in: query
          required: false
          description: Filter by tag
          schema:
            type: string

      responses:
        '200':
          description: Pet list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pets'

        '400':
          $ref: '#/components/responses/BadRequest'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '500':
          $ref: '#/components/responses/InternalServerError'

      security:
        - ApiKeyAuth: []

    post:
      operationId: createPet
      tags:
        - Pets
      summary: Create a pet
      description: Create a new pet with the provided information

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetInput'

      responses:
        '201':
          description: Created pet successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'

        '400':
          $ref: '#/components/responses/BadRequest'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '409':
          $ref: '#/components/responses/Conflict'

        '500':
          $ref: '#/components/responses/InternalServerError'

      security:
        - ApiKeyAuth: []


  /pets/{petId}:

    get:
      operationId: getPetById
      tags:
        - Pets
      summary: Get a pet
      description: Get information about a specific pet by ID

      parameters:
        - $ref: '#/components/parameters/PetId'

      responses:
        '200':
          description: Information about the pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'

        '400':
          $ref: '#/components/responses/BadRequest'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          $ref: '#/components/responses/NotFound'

        '500':
          $ref: '#/components/responses/InternalServerError'

      security:
        - ApiKeyAuth: []

    put:
      operationId: updatePet
      tags:
        - Pets
      summary: Update a pet
      description: Update information about a specific pet

      parameters:
        - $ref: '#/components/parameters/PetId'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetInput'

      responses:
        '200':
          description: Updated pet successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'

        '400':
          $ref: '#/components/responses/BadRequest'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          $ref: '#/components/responses/NotFound'

        '500':
          $ref: '#/components/responses/InternalServerError'

      security:
        - ApiKeyAuth: []

    delete:
      operationId: deletePet
      tags:
        - Pets
      summary: Delete a pet
      description: Delete a specific pet by ID

      parameters:
        - $ref: '#/components/parameters/PetId'

      responses:
        '204':
          description: Deleted pet successfully

        '400':
          $ref: '#/components/responses/BadRequest'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          $ref: '#/components/responses/NotFound'

        '500':
          $ref: '#/components/responses/InternalServerError'

      security:
        - ApiKeyAuth: []


components:

  parameters:

    PetId:
      name: petId
      in: path
      required: true
      description: Pet ID
      schema:
        type: integer
        format: int64
        minimum: 1


  schemas:

    Pet:
      type: object
      required:
        - id
        - name

      properties:
        id:
          type: integer
          format: int64
          example: 1

        name:
          type: string
          example: Milo

        tag:
          type: string
          example: dog

    PetInput:
      type: object
      required:
        - name

      properties:
        name:
          type: string
          example: Milo

        tag:
          type: string
          example: dog

    Pets:
      type: object
      required:
        - pets

      properties:
        pets:
          type: array
          items:
            $ref: '#/components/schemas/Pet'

    Error:
      type: object
      required:
        - code
        - message

      properties:
        code:
          type: integer
          example: 400

        message:
          type: string
          example: Invalid request


  responses:

    BadRequest:
      description: Invalid request parameters or body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Unauthorized access due to missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Could not find the specified pet
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: Conflict occurred, such as trying to create a pet with an existing ID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'


  securitySchemes:

    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key