```yaml
openapi: 3.1.0
info:
  title: Social Network API
  version: 1.0.0
  description: >
    API for authentication and reading social-network posts.
    Access tokens use JWT Bearer authentication.

servers:
  - url: https://api.example.com/v1

tags:
  - name: Authentication
  - name: Posts

paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate a user
      operationId: login
      security: []
      description: >
        Public endpoint. Returns an access token and a refresh token
        after successful authentication. Invalid credentials use a
        generic error message to reduce user enumeration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: alice
              password: example-password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_CREDENTIALS
                message: Invalid username or password
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh authentication tokens
      operationId: refreshTokens
      security: []
      description: >
        Requires a valid refresh token in the request body.
        A successful refresh should rotate the refresh token and
        invalidate the previous one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Refresh token is invalid, expired, revoked, or reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_REFRESH_TOKEN
                message: Refresh token is invalid or expired
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /posts/{id}:
    get:
      tags: [Posts]
      summary: Get a post by ID
      operationId: getPostById
      security:
        - bearerAuth: [posts:read]
      parameters:
        - name: id
          in: path
          required: true
          description: Unique post identifier
          schema:
            type: string
            minLength: 1
            maxLength: 64
          example: post_123
      responses:
        '200':
          description: Post retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: UNAUTHENTICATED
                message: Authentication is required
        '403':
          description: Authenticated user lacks the required scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INSUFFICIENT_SCOPE
                message: Insufficient permission
        '404':
          description: Post does not exist or is not accessible to the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: POST_NOT_FOUND
                message: Post not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 1
          format: password
          writeOnly: true

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          writeOnly: true

    TokenResponse:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
          description: Short-lived access token
        refreshToken:
          type: string
          description: Rotated refresh token
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          minimum: 1
          description: Access-token lifetime in seconds

    Post:
      type: object
      additionalProperties: false
      required: [id, authorId, content, createdAt]
      properties:
        id:
          type: string
        authorId:
          type: string
        content:
          type: string
          maxLength: 10000
        createdAt:
          type: string
          format: date-time
        visibility:
          type: string
          enum: [public, followers, private]

    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, issue]
            properties:
              field:
                type: string
              issue:
                type: string

  responses:
    BadRequest:
      description: Invalid request body or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: BAD_REQUEST
            message: Request validation failed

    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds before retrying
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RATE_LIMITED
            message: Too many requests

    InternalServerError:
      description: Unexpected server error; internal details are not exposed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: An unexpected error occurred
```