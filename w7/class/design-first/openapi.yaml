openapi: 3.0.3

info:
  title: Product API
  description: API quản lý sản phẩm
  version: 1.0.0

servers:
  - url: http://localhost:5000

tags:
  - name: Product
    description: Product management

paths:

  /api/v1/products/:

    get:
      tags:
        - Product
      summary: Get all products
      description: Lấy danh sách tất cả sản phẩm
      operationId: controllers.product_controller.get_products

      responses:
        '200':
          description: Successfully retrieved products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

    post:
      tags:
        - Product
      summary: Create a product
      description: Tạo sản phẩm mới
      operationId: controllers.product_controller.create_product

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'

      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

        '400':
          description: Invalid request

components:
  schemas:

    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1

        name:
          type: string
          example: Apple iPhone 36

        price:
          type: number
          format: float
          example: 999.99

        description:
          type: string
          example: A high-end smartphone

    ProductRequest:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
          example: Apple iPhone 36

        price:
          type: number
          format: float
          example: 999.99

        description:
          type: string
          example: A high-end smartphone