openapi: 3.1.0
info:
  title: Books API — Lab 08
  version: 1.0.0
  contact:
    name: INT3505E — Lab 08
    email: lab08@example.edu
  description: |
    Educational API. The application is the reference for intended behavior.
servers:
  - url: http://localhost:5000
tags:
  - name: health
    description: Service liveness
  - name: books
    description: Book catalogue CRUD
paths:
  /health:
    get:
      operationId: healthCheck
      tags: [health]
      description: Report whether the service is ready to accept requests.
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
  /books:
    get:
      operationId: listBooks
      tags: [books]
      description: List books, optionally filtered by author or year and paginated (20 per page).
      parameters:
        - in: query
          name: author
          schema: {type: string}
        - in: query
          name: year
          schema: {type: integer}
        - in: query
          name: page
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: List books
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Book'}
        '400': {$ref: '#/components/responses/BadRequest'}
    post:
      operationId: createBook
      tags: [books]
      description: Create a book. Title and author are required; year and ISBN are optional.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BookInput'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Book'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /books/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: integer, minimum: 1}
    get:
      operationId: getBook
      tags: [books]
      description: Read a single book by id.
      responses:
        '200':
          description: Book found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Book'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: updateBook
      tags: [books]
      description: Replace a book. Optional fields omitted from the payload are cleared.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BookInput'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Book'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      operationId: deleteBook
      tags: [books]
      description: Delete a book. Returns 204 with an empty body.
      responses:
        '204':
          description: Deleted (response has no body)
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  schemas:
    Book:
      type: object
      additionalProperties: false
      required: [id, title, author, year, isbn]
      properties:
        id: {type: integer, minimum: 1}
        title: {type: string, minLength: 1, maxLength: 200}
        author: {type: string, minLength: 1, maxLength: 200}
        year:
          type:
            - integer
            - 'null'
          minimum: 1450
          maximum: 2100
        isbn:
          type:
            - string
            - 'null'
          pattern: '^\d{13}$'
    BookInput:
      type: object
      additionalProperties: false
      required: [title, author]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        author: {type: string, minLength: 1, maxLength: 200}
        year:
          type:
            - integer
            - 'null'
          minimum: 1450
          maximum: 2100
        isbn:
          type:
            - string
            - 'null'
          pattern: '^\d{13}$'
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        errors:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              message: {type: string}
  responses:
    NotFound:
      description: Missing book
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Duplicate ISBN
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
